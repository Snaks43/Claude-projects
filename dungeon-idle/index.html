<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0e18">
<title>Delvebound</title>
<style>
  :root{color-scheme:dark;--bg:#0c0e18;--panel:#151827;--panel2:#1d2135;--line:#2a2f4a;--text:#e9e6f2;--dim:#8e92b0;--gold:#ffc94a;--hp:#e5484d;--good:#5be37d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100%}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;gap:8px;font-weight:700}
  #hud .big{font-size:16px}
  #hud .dim{font-size:12px;color:var(--dim);font-weight:600}
  #gold{color:var(--gold)}
  #spd{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;min-width:44px}
  #hpbar{position:relative;height:16px;margin:0 12px 3px;background:#2a1217;border-radius:8px;overflow:hidden;border:1px solid #4a1f27}
  #hpbar i{position:absolute;inset:0;width:100%;background:linear-gradient(#ef5a5f,#b92d34);transition:width .15s}
  #hpbar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;font-weight:700;text-shadow:0 1px 2px #000}
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #log{position:absolute;left:8px;bottom:6px;right:8px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
  #log div{font-size:12px;font-weight:700;text-shadow:0 1px 3px #000,0 0 6px #000;animation:fade 6s forwards}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
  #tabs{display:flex;background:var(--panel);border-top:1px solid var(--line)}
  #tabs button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;font-weight:700;padding:11px 0;border-bottom:3px solid transparent}
  #tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
  #panel{flex:0 0 auto;height:38%;max-height:320px;background:var(--panel);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;font-size:12px;margin-bottom:8px}
  .stats div{color:var(--dim)} .stats b{color:var(--text);float:right}
  .row{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:7px 9px;margin-bottom:6px;min-height:46px}
  .row .sl{width:54px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;flex:none}
  .row .nm{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.25}
  .row .nm small{display:block;font-weight:500;color:var(--dim);font-size:11px}
  .row button,.tg{background:#2c3354;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;flex:none}
  .row button:active,.tg:active{background:#3a4470}
  .row button.sell{color:var(--gold)}
  .row button.dis{opacity:.45}
  .bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .tg.on{background:#2f5a3c;border-color:#4a8a5c}
  .empty{color:var(--dim);text-align:center;padding:18px 8px;font-size:13px}
  .foot{text-align:center;font-size:11px;color:var(--dim);padding:6px}
  .foot a{color:var(--dim)}

  #mpbar{position:relative;height:12px;margin:0 12px 6px;background:#10172e;border-radius:6px;overflow:hidden;border:1px solid #243566}
  #mpbar i{position:absolute;inset:0;width:100%;background:linear-gradient(#5aa0ff,#2f63d0);transition:width .15s}
  #mpbar span{position:absolute;inset:0;text-align:center;font-size:9px;line-height:12px;font-weight:700;text-shadow:0 1px 2px #000}
  #tabs button{font-size:12px}
  .cls{background:var(--panel2);border-left:4px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;display:flex;flex-direction:column;gap:2px}
  .cls small{color:var(--dim);font-size:11px;line-height:1.35}
  .row.col{display:block}
  .lv{color:var(--dim);font-weight:500;font-size:12px;margin-left:4px}
  .meter{height:5px;background:#0c0e18;border-radius:3px;margin-top:6px;overflow:hidden}
  .meter i{display:block;height:100%}
</style>
</head>
<body>

  <div id="hud">
    <div><div class="big" id="floor">Floor 1</div><div class="dim" id="foes"></div></div>

    <button id="spd">1x</button>
  </div>
  <div id="hpbar"><i id="hpfill"></i><span id="hptxt"></span></div>
  <div id="mpbar"><i id="mpfill"></i><span id="mptxt"></span></div>
  <div id="stage"><canvas id="c"></canvas><div id="log"></div></div>
  <div id="tabs"></div>
  <div id="panel"></div>
</div>

  while (n >= 1000 && i < s.length - 1) { n /= 1000; i++; }

const CLASSES = {

  Knight:     {col: "#7aa8ff", sk: ["bash", "guard", "rally"], pas: "One-hander + shield. +25% DEF, +10% block."},

  Duelist:    {col: "#6be0c8", sk: ["flurry", "focus", "venom"], pas: "Dual or lone one-handed melee. +10% crit, +10% speed."},
  Archer:     {col: "#9be05b", sk: ["pshot", "multishot", "rain"], pas: "Bows and crossbows. +5% crit, +0.5 range."},
  Lancer:     {col: "#e8c25a", sk: ["impale", "brace", "volley"], pas: "Spears. +10% ATK, +10% DEF."},
  Mage:       {col: "#c58bff", sk: ["fireball", "nova", "surge"], pas: "Staves, wands, orbs. +30% mana, +10% ATK."},
  Battlemage: {col: "#ff9ad0", sk: ["flameedge", "ward", "spellstrike"], pas: "Melee and magic mixed. +15% mana, +10% DEF."},
};
const PASSIVE = {
  Knight: {def: 1.25, block: 10}, Berserker: {atk: 1.15, hp: 1.1}, Duelist: {crit: 10, aspd: 1.1}, Archer: {crit: 5, rng: .5},
  Lancer: {atk: 1.1, def: 1.1}, Mage: {mp: 1.3, mpr: 1.3, atk: 1.1}, Battlemage: {mp: 1.15, def: 1.1, atk: 1.05}, Novice: {},
};
const skNeed = lv => 6 + 4 * lv;

// parts: [name, value, chance]
const TYPES = [
  {id: "slime",    name: "Slime",     minF: 1,  w: 10, hp: 1.0, atk: 0.7, spd: 1.6, g: 0.8, r: 0.38, col: "#5be37d", shape: "slime",    ai: 1.3, parts: [["Slime Gel", 1, .5]]},
  {id: "rat",      name: "Giant Rat", minF: 1,  w: 10, hp: 0.6, atk: 0.8, spd: 3.2, g: 0.7, r: 0.30, col: "#a0907c", shape: "rat",      ai: 0.8, parts: [["Rat Tail", 1, .4], ["Rat Fang", 1.5, .25]]},
  {id: "bat",      name: "Cave Bat",  minF: 2,  w: 8,  hp: 0.5, atk: 0.9, spd: 3.6, g: 0.9, r: 0.30, col: "#8b6bd0", shape: "bat",      ai: 1.0, parts: [["Bat Wing", 1.5, .4], ["Bat Fang", 2, .2]]},
  {id: "goblin",   name: "Goblin",    minF: 2,  w: 8,  hp: 1.1, atk: 1.1, spd: 2.4, g: 1.2, r: 0.36, col: "#78b848", shape: "goblin",   ai: 1.1, parts: [["Goblin Ear", 1.5, .4], ["Goblin Tooth", 2, .2]]},
  {id: "skeleton", name: "Skeleton",  minF: 3,  w: 8,  hp: 1.3, atk: 1.2, spd: 2.0, g: 1.5, r: 0.38, col: "#e6e2d3", shape: "skel",     ai: 1.2, parts: [["Bone", 1.5, .5], ["Skull", 3, .15]]},
  {id: "wolf",     name: "Dire Wolf", minF: 4,  w: 8,  hp: 1.4, atk: 1.5, spd: 3.4, g: 1.8, r: 0.42, col: "#8e96a8", shape: "wolf",     ai: 0.9, parts: [["Wolf Fang", 3, .35], ["Wolf Claw", 3, .3], ["Wolf Pelt", 4, .2]]},
  {id: "spider",   name: "Spider",    minF: 5,  w: 7,  hp: 1.0, atk: 1.3, spd: 2.8, g: 2.0, r: 0.38, col: "#4a3a52", shape: "spider",   ai: 1.4, ranged: true, rng: 4, parts: [["Spider Fang", 3.5, .3], ["Silk Gland", 4, .25], ["Spider Eye", 6, .1]]},
  {id: "cultist",  name: "Cultist",   minF: 6,  w: 7,  hp: 0.9, atk: 2.0, spd: 1.8, g: 2.6, r: 0.36, col: "#a04fc9", shape: "mage",     ai: 1.8, ranged: true, rng: 5, parts: [["Arcane Dust", 4, .4], ["Cursed Eye", 7, .12]]},
  {id: "orc",      name: "Orc",       minF: 7,  w: 7,  hp: 3.0, atk: 1.8, spd: 1.9, g: 3.5, r: 0.50, col: "#4f8a3c", shape: "orc",      ai: 1.5, parts: [["Orc Tusk", 5, .35], ["Orc Hide", 6, .25], ["Iron Scrap", 4, .3]]},
  {id: "golem",    name: "Golem",     minF: 9,  w: 6,  hp: 5.0, atk: 2.2, spd: 1.2, g: 5.0, r: 0.55, col: "#8a8478", shape: "golem",    ai: 2.0, parts: [["Stone Core", 10, .2], ["Rubble", 2, .5]]},
  {id: "wraith",   name: "Wraith",    minF: 10, w: 6,  hp: 1.8, atk: 2.5, spd: 2.6, g: 6.0, r: 0.40, col: "#6fb7e8", shape: "wraith",   ai: 1.2, parts: [["Ectoplasm", 8, .35], ["Soul Shard", 14, .1]]},
];
const MIMIC = {id: "mimic", name: "Mimic", hp: 6, atk: 1.8, spd: 3.0, g: 5, r: 0.5, col: "#b07a3a", shape: "mimic", ai: 1.0, parts: [["Mimic Tongue", 12, 1]]};
const BOSSES = [
  ["Slime King", "#5be37d"], ["Goblin Chieftain", "#78b848"], ["Bone Lord", "#e6e2d3"], ["Fenrir the Alpha", "#8e96a8"],
  ["Broodmother", "#7a4a8a"], ["Orc Warlord", "#4f8a3c"], ["Archlich Veth", "#a04fc9"], ["Stone Colossus", "#8a8478"],
  ["Wraith Sovereign", "#6fb7e8"], ["Ancient Dragon", "#e5484d"],
];
const EXTRA = {
  fort: {n: "Fortune",   d: l => "+" + l * 8 + "% gold",        base: 25, g: 1.3},
  luck: {n: "Scavenger", d: l => "+" + l * 4 + "% drop chance", base: 30, g: 1.3},
};
const MAX_UP = 10;

// ================= state =================
const SAVE_KEY = "delvebound.v1";
let S = {gold: 0, exp: 0, floor: 1, best: 1, kills: 0, eq: {}, bag: [], parts: {}, attr: {str: 0, dex: 0, int: 0, vit: 0}, tr: {fort: 0, luck: 0},
         sk: {}, autoJunk: true, autoParts: false, autoEquip: true, autoSpend: false, autoSmith: true, smithGap: 0, gpsAvg: 0, xpsAvg: 0, t: Date.now(), speed: 1, nid: 1};
try {
  const d = JSON.parse(localStorage.getItem(SAVE_KEY));

    S = Object.assign(S, d);

    S.tr = {fort: (d.tr && d.tr.fort) || 0, luck: (d.tr && d.tr.luck) || 0};
    S.sk = d.sk || {};
    for (const it of Object.values(S.eq).concat(S.bag)) { if (!it) continue; if (!it.bs) it.bs = Object.assign({}, it.s); if (it.up == null) it.up = 0; }
  }
} catch (e) {}

let grid, rooms, seen = new Uint8Array(MW * MH), vis = new Uint8Array(MW * MH);
let mons = [], projs = [], fxs = [], chest = null, smith = null, smithOpen = false;
let hero = {x: 0, y: 0, hp: 100, mp: 30, cd: 0, ang: 0, swing: 0, tgt: null, goal: null, anim: 0, buffs: {}, skcd: {}, gcd: 0, shield: 0};
let ST = {}, ATT = {str: 5, dex: 5, int: 5, vit: 5}, SH = {str: .33, dex: .33, int: .33}, curCls = "Novice", booted = false;
let clearT = 0, thinkT = 0, camX = 0, camY = 0, W = 300, H = 300, dpr = 1, ts = 36, goldWin = [], xpWin = [], dirty = true;
const dist = new Int16Array(MW * MH), par = new Int16Array(MW * MH), que = new Int16Array(MW * MH);
let srcIdx = 0;

// ================= items & equipment =================
function rollRarity(f, boost) {
  const w = [60 / (1 + .03 * f), 28 * (1 + .06 * f), 10 * (1 + .12 * f), 2.5 * (1 + .2 * f), .4 * (1 + .25 * f)];
  for (let i = 1; i < 5; i++) w[i] *= 1 + boost * i;
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < 5; i++) if ((r -= w[i]) <= 0) return i;
  return 0;
}
function pickSlot() {
  let r = Math.random() * SLOT_W.reduce((a, b) => a + b, 0);
  for (let i = 0; i < SLOTS.length; i++) if ((r -= SLOT_W[i]) <= 0) return SLOTS[i];
  return "helm";
}
function makeItem(f, slot, boost) {
  slot = slot || pickSlot();
  const rar = rollRarity(f, boost || 0);
  const b = (4 + 2.4 * f) * RAR[rar].m * rf(.85, 1.15);
  const s = {}; let name, wt = null, kind = null;
  if (slot === "weapon") { wt = pick(Object.keys(WT)); s.atk = b * WT[wt].am; name = WT[wt].nm; }
  else if (slot === "offhand") {
    if (Math.random() < .3) { // a one-handed weapon can also be carried in the off hand
      const ones = Object.keys(WT).filter(k => WT[k].h === 1);
      wt = pick(ones); slot = "weapon"; s.atk = b * WT[wt].am; name = WT[wt].nm;
    } else if (Math.random() < .6) { kind = "shield"; name = pick(BASES.shield); s.def = b * 1.0; s.hp = b * 1.5; s.block = 6 + rar * 3; }
    else { kind = "focus"; name = pick(BASES.focus); s.int = b * .22; s.mp = b * 1.6; s.mpr = .2 + rar * .25; }
  } else {

function hurtHero(raw, from) {
  const k = 25 + 10 * S.floor, def = ST.def * (hero.buffs.brace ? 1.6 : 1);
  let d = Math.max(1, raw * k / (k + def));
  if (hero.buffs.guard) d *= .5;
  if (Math.random() * 100 < ST.block) { d *= .4; ftext(hero.x, hero.y - .9, "Block", "#9ad0ff"); }
  if (hero.shield > 0) { const a = Math.min(hero.shield, d); hero.shield -= a; d -= a; }
  if (d <= 0) return;
  hero.hp -= d; ftext(hero.x, hero.y - .5, fmt(d), "#ff6b6b");
  if (hero.hp <= 0) {
    hero.hp = ST.hp; hero.mp = ST.mp; hero.buffs = {}; hero.shield = 0;
    const nf = Math.max(1, S.floor - 1);
    say("You were defeated" + (nf < S.floor ? " - retreating to floor " + nf : "") + ", slain by " + (from || "a monster"), "#e5484d");
    S.floor = nf; genFloor();

function hitMon(m, dmg, crit) {

function kill(m) {

  m.dead = true; S.kills++;
  const gold = Math.round(m.g * (1 + .08 * S.tr.fort)), xp = Math.max(1, Math.round(m.xp)); gain(gold); gainXp(xp);
  ftext(m.x, m.y - .8, "+" + fmt(gold) + "g  +" + fmt(xp) + "xp", "#ffc94a");
  const luck = 1 + .04 * S.tr.luck, f = S.floor;
  const rolls = m.boss ? 2 : 1, ic = m.boss || m.mimic ? 1 : (.1 + (m.elite ? .25 : 0)) * luck;
  for (let i = 0; i < rolls; i++) if (Math.random() < ic) pickup(makeItem(f, null, m.boss ? 1.2 : m.mimic ? 1.5 : m.elite ? .4 : 0));
  if (m.mimic) pickup(makeItem(f, null, 1.5));
  for (const [n, v, c] of m.parts) if (Math.random() < c * (m.elite ? 2 : 1) * luck) { addPart(n, v); ftext(m.x + rf(-.4, .4), m.y + .2, n, "#9ad0ff"); }
  for (let i = 0; i < (m.boss ? 24 : 8); i++) fxs.push({x: m.x, y: m.y, vx: rf(-3, 3), vy: rf(-3, 3), t: .5, c: m.col, p: 1});
  if (m.boss) say(m.name + " has fallen!", "#ffc94a");
}
function openChest() {

    const m = mk(MIMIC, chest.x, chest.y, false, false);
    m.mimic = true; m.awake = true; m.name = "Mimic"; m.cd = .4;
    mons.push(m); say("It was a MIMIC!", "#e5484d"); chest.gone = true; return;
  }
  const f = S.floor, g = Math.round(15 * (4 + 2 * f) * Math.pow(1.08, f));
  gain(g); say("Treasure! +" + fmt(g) + " gold", "#ffc94a");
  const best = [makeItem(f, null, 1), makeItem(f, null, 1)].sort((a, b) => score(b) - score(a))[0];
  pickup(best);
  if (Math.random() < .6) { addPart("Gemstone", 8); say("Found a Gemstone", "#9ad0ff"); }
  if (Math.random() < .25) { addPart("Ancient Relic", 16); say("Found an Ancient Relic", "#9ad0ff"); }

  say("The blacksmith offers to upgrade your gear", "#ff9a4a");
  if (S.autoSmith) { const n = autoUpgrade(); if (n) say("Blacksmith upgraded your gear " + n + " time" + (n > 1 ? "s" : ""), "#ff9a4a"); else say("Not enough gold for upgrades", "#8e92b0"); }

// ----- skills -----
function reachOK(t) { return Math.hypot(t.x - hero.x, t.y - hero.y) <= ST.rng + t.r * .5 && (!ST.ranged || los(hero.x, hero.y, t.x, t.y)); }
function trySkills() {
  if (hero.gcd > 0) return;
  const cls = CLASSES[curCls], foes = mons.filter(m => !m.dead && m.awake);
  if (!foes.length) return;
  const t = hero.tgt;
  if (!foes.some(m => Math.hypot(m.x - hero.x, m.y - hero.y) < 7)) return;
  for (const id of cls.sk) {
    const d = SK[id];
    if ((hero.skcd[id] || 0) > 0 || hero.mp < d.cost) continue;
    let ok = false;
    if (d.buff) ok = !hero.buffs[d.buff] && t && Math.hypot(t.x - hero.x, t.y - hero.y) < 5 && (d.need !== "hurt" || hero.hp < ST.hp * .85);
    else if (d.heal) ok = hero.hp < ST.hp * .5;
    else if (d.mode === "aoeSelf") ok = foes.some(m => Math.hypot(m.x - hero.x, m.y - hero.y) < d.radius + m.r);
    else ok = !!(t && !t.dead && reachOK(t));
    if (ok) { cast(id); hero.gcd = .35; return; }
  }
}
function cast(id) {
  const d = SK[id], st = S.sk[id] || (S.sk[id] = {lv: 1, uses: 0}), pw = 1 + .15 * (st.lv - 1), col = CLASSES[curCls].col;
  hero.mp -= d.cost; hero.skcd[id] = d.cd * Math.max(.5, 1 - .03 * (st.lv - 1)); st.uses++;
  if (st.lv < 10 && st.uses >= skNeed(st.lv)) { st.lv++; st.uses = 0; say(d.n + " reached level " + st.lv + "!", "#8ad0ff"); }
  dirty = true; hero.swing = 1;
  ftext(hero.x, hero.y - 1, d.n, col, true);
  if (d.buff) {
    hero.buffs[d.buff] = d.dur * (1 + .05 * (st.lv - 1));
    if (d.shield) hero.shield = ST.hp * d.shield * pw;
    ring(hero.x, hero.y, 1.2, col); return;
  }
  if (d.heal) { const h = ST.hp * d.heal * pw; hero.hp = Math.min(ST.hp, hero.hp + h); ftext(hero.x, hero.y - .5, "+" + fmt(h), "#5be37d"); ring(hero.x, hero.y, 1.2, "#5be37d"); return; }
  const base = ST.atk * (hero.buffs.rage ? 1.4 : 1) * (hero.buffs.surge ? 1.5 : 1);
  const fx = m => {
    if (m.dead) return;
    if (d.stun) m.stun = Math.max(m.stun, d.stun * (m.boss ? .4 : 1));
    if (d.slow) m.slow = Math.max(m.slow, d.slow);
    if (d.dot) m.dots.push({dps: base * d.dot * pw / d.dotDur, t: d.dotDur});
  };
  const hit = (m, mult) => {
    const c = hero.buffs.focus || Math.random() * 100 < ST.crit;
    hitMon(m, base * d.mult * pw * (mult || 1) * rf(.9, 1.1) * (c ? 2 : 1), c); fx(m);
  };
  const t = hero.tgt, foes = mons.filter(m => !m.dead && m.awake);
  switch (d.mode) {
    case "single": for (let i = 0; i < (d.hits || 1); i++) if (!t.dead) hit(t); beam(hero.x, hero.y, t.x, t.y, col); break;
    case "splash": projs.push({x: hero.x, y: hero.y, own: 1, tgt: t, dmg: base * d.mult * pw, crit: false, splash: d.radius, life: 2, col: "#ff8a3a", sp: 10, proj: "magic"}); break;
    case "multi": {
      const n = d.n + Math.floor((st.lv - 1) / 3);
      const ts2 = foes.filter(m => Math.hypot(m.x - hero.x, m.y - hero.y) <= ST.rng + 1 && los(hero.x, hero.y, m.x, m.y))
        .sort((a, b) => Math.hypot(a.x - hero.x, a.y - hero.y) - Math.hypot(b.x - hero.x, b.y - hero.y)).slice(0, n);
      for (const m of ts2) { hit(m); beam(hero.x, hero.y, m.x, m.y, col); } break;
    }
    case "rain": { ring(hero.x, hero.y, ST.rng, col); foes.filter(m => Math.hypot(m.x - hero.x, m.y - hero.y) <= ST.rng + 1).slice(0, 14).forEach(m => hit(m)); break; }
    case "aoeSelf": { const r = d.radius * (1 + .04 * (st.lv - 1)); ring(hero.x, hero.y, r, col); foes.filter(m => Math.hypot(m.x - hero.x, m.y - hero.y) < r + m.r).forEach(m => hit(m)); break; }
    case "line": {
      const a = Math.atan2(t.y - hero.y, t.x - hero.x), ux = Math.cos(a), uy = Math.sin(a);
      hit(t); beam(hero.x, hero.y, hero.x + ux * (ST.rng + 2.5), hero.y + uy * (ST.rng + 2.5), col);
      for (const m of foes) {
        if (m === t) continue; const rx = m.x - hero.x, ry = m.y - hero.y, al = rx * ux + ry * uy, pe = Math.abs(-rx * uy + ry * ux);
        if (al > 0 && al < ST.rng + 2.5 && pe < .9) hit(m, .8);
      }
      break;
    }
  }
}

function update(dt) {
  thinkT -= dt; if (thinkT <= 0) { think(); thinkT = .2; }
  hero.anim += dt; hero.swing = Math.max(0, hero.swing - dt * 5);
  hero.hp = Math.min(ST.hp, hero.hp + ST.regen * dt);
  hero.mp = Math.min(ST.mp, hero.mp + ST.mpr * dt);
  hero.cd -= dt; hero.gcd -= dt;
  for (const k in hero.buffs) if ((hero.buffs[k] -= dt) <= 0) { delete hero.buffs[k]; if (k === "ward") hero.shield = 0; }
  for (const k in hero.skcd) if (hero.skcd[k] > 0) hero.skcd[k] -= dt;
  trySkills();

  // hero
  const t = hero.tgt, aspd = ST.aspd * (hero.buffs.rage ? 1.4 : 1);
  if (t && !t.dead) {
    const d = Math.hypot(t.x - hero.x, t.y - hero.y);
    hero.ang = Math.atan2(t.y - hero.y, t.x - hero.x);
    if (reachOK(t)) {
      if (hero.cd <= 0) {
        hero.cd = 1 / aspd; hero.swing = 1;
        const crit = hero.buffs.focus || Math.random() * 100 < ST.crit, dmg = ST.atk * (hero.buffs.rage ? 1.4 : 1) * (hero.buffs.surge ? 1.5 : 1) * rf(.9, 1.1) * (crit ? 2 : 1);
        if (ST.ranged) projs.push({x: hero.x, y: hero.y, own: 1, tgt: t, dmg, crit, life: 2, col: ST.proj === "magic" ? CLASSES[curCls].col : "#f0e2b0", sp: ST.proj === "spear" ? 13 : 12, proj: ST.proj});
        else hitMon(t, dmg, crit);
      }
    } else {
      const n = nextTileTo(Math.floor(t.x), Math.floor(t.y));
      if (n) { if (d < 1.5 && los(hero.x, hero.y, t.x, t.y)) stepOn(hero, t.x, t.y, 3.4, dt); else stepOn(hero, n[0], n[1], 3.4, dt); }
    }
  } else if (hero.goal) {
    const n = nextTileTo(hero.goal[0], hero.goal[1]);
    if (n) stepOn(hero, n[0], n[1], 3.4, dt);
    if (chest && !chest.open && Math.hypot(chest.x - hero.x, chest.y - hero.y) < 1.1) openChest();
    if (smith && !smith.used && Math.hypot(smith.x - hero.x, smith.y - hero.y) < 1.6) openSmith();
  }

  // monsters
  for (const m of mons) {
    if (m.dead) continue;
    m.flash -= dt; m.cd -= dt; m.ph += dt * 5;
    for (const dt2 of m.dots) { dt2.t -= dt; m.hp -= dt2.dps * dt; }
    if (m.dots.length) { m.dots = m.dots.filter(x => x.t > 0); if (m.hp <= 0) { kill(m); continue; } }
    if (!m.awake) continue;
    if (m.stun > 0) { m.stun -= dt; continue; }
    if (m.slow > 0) m.slow -= dt;
    const d = Math.hypot(hero.x - m.x, hero.y - m.y), sp = m.spd * (m.slow > 0 ? .5 : 1);
    m.ang = Math.atan2(hero.y - m.y, hero.x - m.x);
    if (m.ranged) {
      if (d > m.rng * .9 || !los(m.x, m.y, hero.x, hero.y)) chase(m, d, dt, sp);
      else if (m.cd <= 0) { m.cd = m.ai; projs.push({x: m.x, y: m.y, own: 0, vx: Math.cos(m.ang), vy: Math.sin(m.ang), dmg: m.atk, life: 2.2, col: m.shape === "spider" ? "#a8e060" : "#d070ff", sp: 6, from: m.name}); }
    } else if (d > m.r + .45) chase(m, d, dt, sp);
    else if (m.cd <= 0) { m.cd = m.ai; hurtHero(m.atk, m.name); }
    if (m.boss) {
      m.bossT -= dt;
      if (m.bossT <= 0) {
        m.bossT = 5; const n = 10, o = Math.random() * 6;
        for (let i = 0; i < n; i++) projs.push({x: m.x, y: m.y, own: 0, vx: Math.cos(o + i * 6.283 / n), vy: Math.sin(o + i * 6.283 / n), dmg: m.atk * .5, life: 2.5, col: "#ff7a5a", sp: 4.5, from: m.name});
      }
      if (!m.summoned && m.hp < m.max * .5) {
        m.summoned = true; say(m.name + " calls for help!", "#e5484d");
        const r = rooms.find(r => r.kind === "boss"); spawnIn(r); spawnIn(r); mons[mons.length - 1].awake = mons[mons.length - 2].awake = true;
      }
    }
  }
  for (let i = 0; i < mons.length; i++) { // separation
    const a = mons[i]; if (a.dead) continue;
    for (let j = i + 1; j < mons.length; j++) {
      const b = mons[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = (a.r + b.r) * .8;
      if (d < min && d > 1e-4) { const p = (min - d) / 2 / d; slide(a, -dx * p, -dy * p); slide(b, dx * p, dy * p); }
    }
  }

  // projectiles
  for (const p of projs) {
    p.life -= dt;
    if (p.own) {
      const tg = p.tgt && !p.tgt.dead ? p.tgt : null;
      if (tg) {
        const dx = tg.x - p.x, dy = tg.y - p.y, d = Math.hypot(dx, dy) || 1; p.vx = dx / d; p.vy = dy / d;
        if (d < tg.r + .2) {
          if (p.splash) { ring(p.x, p.y, p.splash, "#ff8a3a"); for (const m of mons.filter(m => !m.dead && Math.hypot(m.x - p.x, m.y - p.y) < p.splash + m.r)) hitMon(m, p.dmg * rf(.9, 1.1) * (m === tg ? 1 : .6), false); }
          else hitMon(tg, p.dmg, p.crit);
          p.life = 0; continue;
        }
      } else if (p.vx === undefined) { p.life = 0; continue; }
    } else if (Math.hypot(hero.x - p.x, hero.y - p.y) < .45) { hurtHero(p.dmg, p.from); p.life = 0; continue; }
    p.x += p.vx * p.sp * dt; p.y += p.vy * p.sp * dt;
    if (solid(p.x, p.y)) p.life = 0;
  }
  projs = projs.filter(p => p.life > 0);

  for (const f of fxs) { f.t -= dt; if (f.p) { f.x += f.vx * dt; f.y += f.vy * dt; } else if (!f.ring && !f.beam) f.y -= .9 * dt; }
  fxs = fxs.filter(f => f.t > 0);

  // floor clear
  if (!mons.some(m => !m.dead)) {
    if (clearT === 0) say("Floor " + S.floor + " cleared!", "#5be37d");
    clearT += dt;
    if (clearT > 2.2) { S.floor++; if (S.floor > S.best) S.best = S.floor; genFloor(); }
  }
}
function chase(m, d, dt, sp) {
  const mx = Math.floor(m.x), my = Math.floor(m.y);
  if (d < 2 && los(m.x, m.y, hero.x, hero.y)) {
    const s = Math.min(d, sp * dt); slide(m, Math.cos(m.ang) * s, Math.sin(m.ang) * s); return;
  }
  const c = my * MW + mx; let best = null, bv = dist[c] < 0 ? 1e9 : dist[c];
  for (const [dx, dy] of K4) {
    const nx = mx + dx, ny = my + dy; if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;
    const v = dist[ny * MW + nx]; if (v >= 0 && v < bv) { bv = v; best = [nx + .5, ny + .5]; }
  }
  if (best) { const a = m.ang; stepOn(m, best[0], best[1], sp, dt); m.ang = a; }

// ================= rendering =================
const cv = $("c"), ctx = cv.getContext("2d");
function resize() {
  const r = cv.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
  ts = Math.max(28, Math.min(W / 10, 48));
}
addEventListener("resize", resize);

function drawWeapon(wt, col, r) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = "round"; ctx.lineWidth = 3;
  ctx.beginPath();
  switch (wt) {
    case "dagger": ctx.moveTo(r * .7, 0); ctx.lineTo(r * 1.45, 0); ctx.stroke(); break;
    case "axe": ctx.moveTo(r * .6, 0); ctx.lineTo(r * 1.8, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(r * 1.5, 0); ctx.lineTo(r * 1.9, -r * .55); ctx.lineTo(r * 2.05, r * .1); ctx.fill(); break;
    case "greatsword": ctx.lineWidth = 5; ctx.moveTo(r * .6, 0); ctx.lineTo(r * 2.5, 0); ctx.stroke(); break;
    case "battleaxe": ctx.lineWidth = 4; ctx.moveTo(r * .6, 0); ctx.lineTo(r * 2.2, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(r * 1.7, 0); ctx.lineTo(r * 2.1, -r * .8); ctx.lineTo(r * 2.3, 0); ctx.lineTo(r * 2.1, r * .8); ctx.fill(); break;
    case "spear": ctx.moveTo(r * .2, 0); ctx.lineTo(r * 2.8, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(r * 2.8, -r * .25); ctx.lineTo(r * 3.3, 0); ctx.lineTo(r * 2.8, r * .25); ctx.fill(); break;
    case "bow": ctx.lineWidth = 3; ctx.arc(r * 1.0, 0, r * 1.0, -1.15, 1.15); ctx.stroke(); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(r * 1.0 + Math.cos(-1.15) * r, Math.sin(-1.15) * r); ctx.lineTo(r * 1.0 + Math.cos(1.15) * r, Math.sin(1.15) * r); ctx.stroke(); break;
    case "crossbow": ctx.moveTo(r * .6, 0); ctx.lineTo(r * 1.6, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(r * 1.3, -r * .6); ctx.lineTo(r * 1.3, r * .6); ctx.stroke(); break;
    case "wand": ctx.moveTo(r * .6, 0); ctx.lineTo(r * 1.5, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(r * 1.55, 0, r * .2, 0, 6.283); ctx.fill(); break;
    case "staff": ctx.moveTo(r * .2, 0); ctx.lineTo(r * 2.0, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(r * 2.05, 0, r * .28, 0, 6.283); ctx.fill(); break;
    default: ctx.moveTo(r * .7, 0); ctx.lineTo(r * 2, 0); ctx.stroke(); // sword
  }
}
function drawHero(T) {
  const r = ts * .36, main = S.eq.weapon, off = main && handsOf(main) === 2 ? null : S.eq.offhand;
  ctx.save(); ctx.translate(hero.x * ts, hero.y * ts);
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(0, r * .8, r, r * .38, 0, 0, 6.283); ctx.fill();
  if (hero.buffs.rage || hero.buffs.surge || hero.buffs.focus) { ctx.strokeStyle = CLASSES[curCls].col; ctx.lineWidth = 2; ctx.globalAlpha = .6 + .3 * Math.sin(T / 120); ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; }
  if (hero.shield > 0) { ctx.strokeStyle = "#9ad0ff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r * 1.35, 0, 6.283); ctx.stroke(); }
  ctx.rotate(hero.ang);
  const sw = Math.sin(hero.swing * 3.14);
  if (off) {
    ctx.save();
    if (off.wt) { ctx.rotate(-.6 + sw * 1.1); drawWeapon(off.wt, RAR[off.rar].c, r); }
    else if (off.kind === "shield") {
      ctx.fillStyle = RAR[off.rar].c; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(r * .75, -r * .85, r * .35, r * .6, 0, 0, 6.283); ctx.fill(); ctx.stroke();
    } else { ctx.fillStyle = RAR[off.rar].c; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(r * .9, -r * .8, r * .3, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0; }
    ctx.restore();
  }
  if (main) { ctx.save(); ctx.rotate(.5 - sw * 1.1); drawWeapon(main.wt, RAR[main.rar].c, r); ctx.restore(); }
  else { ctx.strokeStyle = "#e8c9a0"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(r * .6, 0); ctx.lineTo(r * 1.1 + sw * r * .5, 0); ctx.stroke(); }
  ctx.fillStyle = S.eq.armor ? RAR[S.eq.armor.rar].c : "#5a8cff"; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.fillStyle = S.eq.helm ? RAR[S.eq.helm.rar].c : "#e8c9a0"; ctx.beginPath(); ctx.arc(r * .15, 0, r * .55, 0, 6.283); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#101020"; ctx.fillRect(r * .35, -r * .25, r * .22, r * .12); ctx.fillRect(r * .35, r * .13, r * .22, r * .12);
  ctx.restore();
}
function drawSmith(T) {

  } else if (tab === "hero") {
    h += `<div class="cls"><b style="color:#8ad0ff"><span id="expv"></span> EXP</b><small id="lean"></small></div><div class="bar">${tgl(S.autoSpend, "autospend", "Auto-spend EXP")}</div>`;
    for (const k in ATTRS) h += `<div class="row"><div class="nm" id="an-${k}"></div><button data-at="${k}" id="ab-${k}"></button></div>`;
    for (const k in EXTRA) h += `<div class="row"><div class="nm" id="en-${k}"></div><button data-ex="${k}" id="eb-${k}"></button></div>`;
  } else if (tab === "parts") {
    const names = Object.keys(S.parts), total = names.reduce((a, n) => a + S.parts[n].val, 0);
    h += `<div class="bar">${tgl(S.autoParts, "autoparts", "Auto-sell parts")}<button class="tg" data-a="sellparts">Sell all (${fmt(total)}g)</button></div>`;
    if (!names.length) h += `<div class="empty">Monsters drop fangs, claws, hides and more.<br>Sell them for gold.</div>`;
    for (const n of names.sort()) { const p = S.parts[n]; h += `<div class="row"><div class="nm">${esc(n)}<small>x${p.n} · worth ${fmt(p.val)}g</small></div><button class="sell" data-p="${esc(n)}">Sell</button></div>`; }
  } else if (tab === "smith") {
    h += `<div class="bar">${tgl(S.autoSmith, "autosmith", "Auto-upgrade on visit")}</div>`;
    if (!smithOpen) h += `<div class="empty">Blacksmith rooms are rare, found from floor 2 and at least every 6 floors. Bring gold: equipped gear can be upgraded up to +${MAX_UP}.</div>`;
    else for (const sl of SLOTS) {
      const it = S.eq[sl]; if (!it) continue;
      h += `<div class="row"><div class="sl">${SLOT_NAME[sl]}</div><div class="nm">${itemName(it)}<small>${statTxt(it)}</small></div><button class="sell" data-up="${sl}" id="ub-${sl}"></button></div>`;
    }
    h += `<div class="foot">Gold: <span id="smg"></span></div>`;
  }
  panel.innerHTML = h; refreshPanel();
}
function refreshPanel() {
  if (tab === "hero") {
    $("expv").textContent = fmt(S.exp);
    $("lean").textContent = `Leaning ${Math.round(SH.str * 100)}% STR · ${Math.round(SH.dex * 100)}% DEX · ${Math.round(SH.int * 100)}% INT. The hero favours gear that fits.`;
    for (const k in ATTRS) {
      const c = attrCost(k), gear = ATT[k] - 5 - S.attr[k];
      $("an-" + k).innerHTML = `${ATTRS[k].n} <span class="lv">${fmt(ATT[k])}</span><small>${ATTRS[k].d}${gear ? " · +" + fmt(gear) + " from gear" : ""}</small>`;
      const b = $("ab-" + k); b.textContent = fmt(c) + " xp"; b.className = "sell" + (S.exp < c ? " dis" : "");
    }
    for (const k in EXTRA) {
      const u = EXTRA[k], l = S.tr[k], c = extraCost(k);
      $("en-" + k).innerHTML = `${u.n} <span class="lv">Lv ${l}</span><small>${u.d(l)} → ${u.d(l + 1)}</small>`;
      const b = $("eb-" + k); b.textContent = fmt(c) + " xp"; b.className = "sell" + (S.exp < c ? " dis" : "");
    }
  } else if (tab === "smith") {
    const g = $("smg"); if (g) g.textContent = fmt(S.gold);
    for (const sl of SLOTS) {
      const b = $("ub-" + sl), it = S.eq[sl]; if (!b || !it) continue;
      const max = it.up >= MAX_UP, c = upCost(it);
      b.textContent = max ? "MAX" : "+" + (it.up + 1) + " · " + fmt(c) + "g"; b.className = "sell" + (max || S.gold < c ? " dis" : "");
    }
  }
}
panel.onclick = e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.at) { buyAttr(d.at); }
  else if (d.ex) { buyExtra(d.ex); }
  else if (d.up) { const it = S.eq[d.up]; if (it) upgradeItem(it); }
  else if (d.e) { manualEquip(+d.e, d.w); }
  else if (d.s) { sellFromBag(+d.s); }
  else if (d.p) { const p = S.parts[d.p]; if (p) { gain(p.val); delete S.parts[d.p]; } dirty = true; }
  else if (d.a === "junk") { S.autoJunk = !S.autoJunk; if (S.autoJunk) autoEquip(); }
  else if (d.a === "autoeq") { S.autoEquip = !S.autoEquip; if (S.autoEquip) autoEquip(); }
  else if (d.a === "sellbag") { for (const it of S.bag) sellItem(it); S.bag = []; }
  else if (d.a === "autoparts") S.autoParts = !S.autoParts;
  else if (d.a === "sellparts") { for (const n in S.parts) gain(S.parts[n].val); S.parts = {}; }
  else if (d.a === "autospend") { S.autoSpend = !S.autoSpend; if (S.autoSpend) autoSpend(); }
  else if (d.a === "autosmith") S.autoSmith = !S.autoSmith;
  dirty = true; renderPanel();
};
$("spd").onclick = () => { const o = [1, 2, 4, 8, 16]; S.speed = o[(o.indexOf(S.speed) + 1) % o.length] || 1; $("spd").textContent = S.speed + "x"; };
$("spd").textContent = S.speed + "x";

function hud() {
  $("gold").textContent = fmt(S.gold) + "g";
  $("exp").textContent = fmt(S.exp) + " xp";
  const alive = mons.filter(m => !m.dead).length;
  $("foes").textContent = curCls + " · " + (alive ? alive + " foes" : "cleared");
  $("hpfill").style.width = Math.max(0, hero.hp / ST.hp * 100) + "%";
  $("hptxt").textContent = fmt(Math.max(0, hero.hp)) + " / " + fmt(ST.hp) + (hero.shield > 0 ? " (+" + fmt(hero.shield) + ")" : "");
  $("mpfill").style.width = Math.max(0, hero.mp / ST.mp * 100) + "%";
  $("mptxt").textContent = fmt(Math.max(0, hero.mp)) + " / " + fmt(ST.mp) + " MP";
  const now = Date.now(); goldWin = goldWin.filter(x => now - x[0] < 20000); xpWin = xpWin.filter(x => now - x[0] < 20000);
  const gps = goldWin.reduce((a, x) => a + x[1], 0) / 20, xps = xpWin.reduce((a, x) => a + x[1], 0) / 20, sp = Math.max(1, S.speed);
  if (goldWin.length) { S.gpsAvg = S.gpsAvg ? S.gpsAvg * .9 + gps / sp * .1 : gps / sp; S.xpsAvg = S.xpsAvg ? S.xpsAvg * .9 + xps / sp * .1 : xps / sp; }
}

// ================= loop & save =================
function save() { S.t = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
let last = performance.now(), acc = 0, uiT = 0, saveT = 0, panelT = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, .25); last = now;
  acc += dt * S.speed; let n = 0;
  while (acc >= 1 / 30 && n < 480) { update(1 / 30); acc -= 1 / 30; n++; }
  if (n >= 480) acc = 0;
  draw(now);
  uiT -= dt; if (uiT <= 0) { hud(); uiT = .15; if (S.autoSpend) autoSpend(); }
  panelT -= dt; if (panelT <= 0) { panelT = .4; if (dirty) renderPanel(); else refreshPanel(); }
  saveT += dt; if (saveT > 5) { save(); saveT = 0; }
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else { last = performance.now(); acc = 0; } });
addEventListener("pagehide", save);

(function boot() {
  resize(); recalc(); hero.hp = ST.hp; hero.mp = ST.mp;
  const away = Math.min((Date.now() - S.t) / 1000, 7200);
  genFloor(); autoEquip(); booted = true;
  if (away > 60 && (S.gpsAvg > 0 || S.xpsAvg > 0)) {
    const g = Math.floor(S.gpsAvg * away * .5), x = Math.floor(S.xpsAvg * away * .5); gain(g); gainXp(x);
    setTimeout(() => say("Welcome back! Your hero earned " + fmt(g) + " gold and " + fmt(x) + " xp while away.", "#ffc94a"), 400);
  }
  renderPanel(); requestAnimationFrame(frame);
})();
window.__dbg = {S, get hero() { return hero; }, get mons() { return mons; }, get ST() { return ST; }, get cls() { return curCls; }, makeItem, pickup, autoEquip, recalc, get smith() { return smith; }};
</script>
</body>
</html>
