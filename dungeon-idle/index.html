<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0e18">
<title>Delvebound</title>
<style>
  :root{color-scheme:dark;--bg:#0c0e18;--panel:#151827;--panel2:#1d2135;--line:#2a2f4a;--text:#e9e6f2;--dim:#8e92b0;--gold:#ffc94a;--hp:#e5484d;--good:#5be37d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
  #app{display:flex;flex-direction:column;height:100%}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;gap:8px;font-weight:700}
  #hud .big{font-size:16px}
  #hud .dim{font-size:12px;color:var(--dim);font-weight:600}
  #gold{color:var(--gold)}
  #spd{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;min-width:44px}
  #hpbar{position:relative;height:16px;margin:0 12px 6px;background:#2a1217;border-radius:8px;overflow:hidden;border:1px solid #4a1f27}
  #hpbar i{position:absolute;inset:0;width:100%;background:linear-gradient(#ef5a5f,#b92d34);transition:width .15s}
  #hpbar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;font-weight:700;text-shadow:0 1px 2px #000}
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #log{position:absolute;left:8px;bottom:6px;right:8px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
  #log div{font-size:12px;font-weight:700;text-shadow:0 1px 3px #000,0 0 6px #000;animation:fade 6s forwards}
  @keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
  #tabs{display:flex;background:var(--panel);border-top:1px solid var(--line)}
  #tabs button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;font-weight:700;padding:11px 0;border-bottom:3px solid transparent}
  #tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
  #panel{flex:0 0 auto;height:38%;max-height:320px;background:var(--panel);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;font-size:12px;margin-bottom:8px}
  .stats div{color:var(--dim)} .stats b{color:var(--text);float:right}
  .row{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:7px 9px;margin-bottom:6px;min-height:46px}
  .row .sl{width:54px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;flex:none}
  .row .nm{flex:1;min-width:0;font-size:13px;font-weight:700;line-height:1.25}
  .row .nm small{display:block;font-weight:500;color:var(--dim);font-size:11px}
  .row button,.tg{background:#2c3354;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit;font-size:12px;font-weight:700;flex:none}
  .row button:active,.tg:active{background:#3a4470}
  .row button.sell{color:var(--gold)}
  .row button.dis{opacity:.45}
  .bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .tg.on{background:#2f5a3c;border-color:#4a8a5c}
  .empty{color:var(--dim);text-align:center;padding:18px 8px;font-size:13px}
  .foot{text-align:center;font-size:11px;color:var(--dim);padding:6px}
  .foot a{color:var(--dim)}

  #party{display:flex;gap:6px;padding:0 12px 6px}
  .pc{flex:1 1 0;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 5px}
  .pc.sel{border-color:var(--gold)} .pc.down{opacity:.45}
  .pn{display:flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;overflow:hidden}
  .pn i{width:8px;height:8px;border-radius:50%;flex:none}
  .pn b{overflow:hidden;text-overflow:ellipsis}
  .pn small{color:var(--dim);font-size:9px;overflow:hidden;text-overflow:ellipsis}
  .bb{height:7px;border-radius:4px;margin-top:3px;background:#0c0e18;overflow:hidden}
  .bb i{display:block;height:100%;width:100%}
  .bb.hp i{background:linear-gradient(#ef5a5f,#b92d34)} .bb.mp{height:5px} .bb.mp i{background:linear-gradient(#5aa0ff,#2f63d0)}
  .hint{font-size:11px;color:var(--dim);margin-bottom:8px;line-height:1.4}
  #tabs button{font-size:11px}
</style>
</head>

    <button id="spd">1x</button>
  </div>
  <div id="party"></div>
  <div id="stage"><canvas id="c"></canvas><div id="log"></div></div>
  <div id="tabs"></div>
  <div id="panel"></div>
</div>

const SCALE = [{hp: 1, atk: 1, tier: 0}];
function floorScale(f) { // enemy strength compounds faster every 5 floors
  while (SCALE.length < f) {
    const k = SCALE.length, tier = Math.floor((k - 1) / 5), p = SCALE[k - 1];
    SCALE.push({hp: p.hp * (1.115 + .007 * tier), atk: p.atk * (1.075 + .005 * tier), tier: Math.floor(k / 5)});
  }
  return SCALE[f - 1];
}

// ================= state =================

    delete S.eq; delete S.attr; delete S.sk;
    for (const m of S.party) { m.attr = Object.assign({str: 0, dex: 0, int: 0, vit: 0}, m.attr); m.sk = m.sk || {}; m.eq = m.eq || {}; }
    const all = S.bag.slice(); for (const m of S.party) all.push(...Object.values(m.eq));
    for (const it of all) { if (!it) continue; if (!it.bs) it.bs = Object.assign({}, it.s); if (it.up == null) it.up = 0; }

// ================= UI =================
const TABS = [["gear", "Gear"], ["bag", "Bag"], ["skills", "Skills"], ["hero", "Stats"], ["party", "Party"], ["parts", "Parts"], ["smith", "Smith"]];
let tab = "gear";
const tabsEl = $("tabs"), panel = $("panel"), partyEl = $("party");
tabsEl.innerHTML = TABS.map(t => `<button data-t="${t[0]}">${t[1]}</button>`).join("");
tabsEl.onclick = e => { const t = e.target.dataset.t; if (t) { tab = t; dirty = true; renderPanel(); } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

const tgl = (on, a, label) => `<button class="tg ${on ? "on" : ""}" data-a="${a}">${label}: ${on ? "ON" : "OFF"}</button>`;
const ROLE_TXT = {front: "Front line", mid: "Mid line", back: "Back line"};

function buildParty() {
  partyEl.innerHTML = heroes.map((h, i) => `<div class="pc" data-i="${i}"><div class="pn"><i style="background:${CLASSES[h.cls].col}"></i><b>${esc(h.m.name)}</b><small>${h.cls}</small></div>
    <div class="bb hp"><i></i></div><div class="bb mp"><i></i></div></div>`).join("");
  dirty = true;
}
partyEl.onclick = e => { const c = e.target.closest(".pc"); if (c) { S.sel = +c.dataset.i; dirty = true; renderPanel(); } };
function memberBar() {
  if (heroes.length < 2) return "";
  return `<div class="bar">${heroes.map((h, i) => `<button class="tg ${i === S.sel ? "on" : ""}" data-sel="${i}">${esc(h.m.name)} · ${h.cls}</button>`).join("")}</div>`;
}

function renderPanel() {
  for (const b of tabsEl.children) b.classList.toggle("on", b.dataset.t === tab);
  dirty = false; let h = "";
  const H = curH(), m = H.m;
  if (tab === "gear") {
    const c = CLASSES[H.cls], A = H.ATT, ST = H.ST;
    h += memberBar() + `<div class="cls" style="border-color:${c.col}"><b style="color:${c.col}">${esc(m.name)} the ${H.cls}${heroes.length > 1 ? " · " + ROLE_TXT[roleOf(H)] : ""}</b><small>${c.pas}</small></div>
      <div class="stats"><div>HP<b>${fmt(ST.hp)}</b></div><div>MP<b>${fmt(ST.mp)}</b></div><div>ATK<b>${fmt(ST.atk)}</b></div>
      <div>DEF<b>${fmt(ST.def)}</b></div><div>SPD<b>${ST.aspd.toFixed(2)}/s</b></div><div>CRIT<b>${fmt(ST.crit)}%</b></div>
      <div>STR<b>${fmt(A.str)}</b></div><div>DEX<b>${fmt(A.dex)}</b></div><div>INT<b>${fmt(A.int)}</b></div></div>`;
    const main = m.eq.weapon, twoH = main && handsOf(main) === 2;
    for (const sl of SLOTS) {
      const it = m.eq[sl];
      let body;
      if (sl === "offhand" && twoH) body = '<span style="color:var(--dim)">Both hands on the ' + esc(main.name) + "</span>";
      else body = it ? itemName(it) + `<small>Lv ${it.ilvl} ${RAR[it.rar].n} · ${statTxt(it)}</small>` : '<span style="color:var(--dim)">Empty</span>';
      h += `<div class="row"><div class="sl">${SLOT_NAME[sl]}</div><div class="nm">${body}</div></div>`;
    }
  } else if (tab === "bag") {
    h += `<div class="bar">${tgl(S.autoEquip, "autoeq", "Auto-equip")}${tgl(S.autoJunk, "junk", "Auto-sell common")}
      <button class="tg" data-a="sellbag">Sell all (${S.bag.length})</button></div>`;
    h += heroes.length > 1 ? `<div class="hint">Shared by the whole party. Equip buttons apply to <b>${esc(m.name)}</b>.</div>` + memberBar() : "";
    const items = S.bag.slice().sort((a, b) => score(b, H) - score(a, H));

      const btns = it.slot === "weapon" && handsOf(it) === 1
        ? `<button data-e="${it.id}">Main</button><button data-e="${it.id}" data-w="offhand">Off</button>` : `<button data-e="${it.id}">Equip</button>`;
      h += `<div class="row"><div class="sl">${SLOT_NAME[it.slot]}</div><div class="nm">${itemName(it)}<small>Lv ${it.ilvl} · ${statTxt(it)}</small></div>

        <div class="meter"><i style="width:${pct}%;background:${c.col}"></i></div></div></div>`;
    }

    for (const k in ATTRS) h += `<div class="row"><div class="nm" id="an-${k}"></div><button data-at="${k}" id="ab-${k}"></button></div>`;
    for (const k in EXTRA) h += `<div class="row"><div class="nm" id="en-${k}"></div><button data-ex="${k}" id="eb-${k}"></button></div>`;
  } else if (tab === "party") {
    h += `<div class="bar">${tgl(S.autoRecruit, "autorecruit", "Auto-recruit")}</div><div class="hint">Every 10 floors a camp of wanderers may offer to join (up to ${MAX_PARTY} members). Frontliners guard, back-liners keep their distance.</div>`;
    heroes.forEach((x, i) => {
      const c = CLASSES[x.cls];
      h += `<div class="row"><div class="nm"><span style="color:${c.col}">${esc(x.m.name)}</span> · ${x.cls}${x.m.arch ? " (" + x.m.arch + ")" : ""}<small>${ROLE_TXT[roleOf(x)]} · HP ${fmt(x.ST.hp)} · ATK ${fmt(x.ST.atk)} · DEF ${fmt(x.ST.def)}${x.down ? " · DOWN" : ""}</small></div>
        ${i ? `<button data-dis="${i}">Dismiss</button>` : ""}</div>`;
    });

        if (c.took) continue;

        h += `<div class="row"><div class="nm">${esc(c.name)} the ${c.arch.k}<small>${c.willing ? "Willing to join" : "Not interested"} · ${c.arch.main}${c.arch.off ? " + " + c.arch.off : ""}</small></div>
          ${c.willing && free ? `<button class="sell" data-rec="${camp.cands.indexOf(c)}">Recruit</button>` : ""}</div>`;
      }

  } else if (tab === "parts") {
    const names = Object.keys(S.parts), total = names.reduce((a, n) => a + S.parts[n].val, 0);
    h += `<div class="bar">${tgl(S.autoParts, "autoparts", "Auto-sell parts")}<button class="tg" data-a="sellparts">Sell all (${fmt(total)}g)</button></div>`;
    h += `<div class="hint">The blacksmith needs parts to take gear past +5. Keep some.</div>`;
    if (!names.length) h += `<div class="empty">Monsters drop fangs, claws, hides and more.</div>`;
    for (const n of names.sort()) { const p = S.parts[n]; h += `<div class="row"><div class="nm">${esc(n)}<small>x${p.n} · worth ${fmt(p.val)}g</small></div><button class="sell" data-p="${esc(n)}">Sell</button></div>`; }

      const b = $("eb-" + k); b.textContent = fmt(c) + " xp"; b.className = "sell" + (S.exp < c ? " dis" : "");
    }
  } else if (tab === "smith") {
    const g = $("smg"); if (g) g.textContent = fmt(S.gold) + " · " + partCount() + " parts";
    for (const sl of SLOTS) {
      const b = $("ub-" + sl), it = H.m.eq[sl]; if (!b || !it) continue;
      const pn = upParts(it), c = upCost(it);
      b.textContent = "+" + (it.up + 1) + " · " + fmt(c) + "g" + (pn ? " + " + pn + " parts" : ""); b.className = "sell" + (canUpgrade(it) ? "" : " dis");
    }
  }
}
panel.onclick = e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset, H = curH();
  if (d.sel != null) S.sel = +d.sel;
  else if (d.at) buyAttr(H, d.at);
  else if (d.ex) buyExtra(d.ex);
  else if (d.up) { const it = H.m.eq[d.up]; if (it) upgradeItem(it); }
  else if (d.e) manualEquip(H, +d.e, d.w);
  else if (d.s) sellFromBag(+d.s);
  else if (d.p) { const p = S.parts[d.p]; if (p) { gain(p.val); delete S.parts[d.p]; } dirty = true; }
  else if (d.dis) dismiss(+d.dis);
  else if (d.rec) { if (camp) recruit(camp.cands[+d.rec]); }
  else if (d.a === "junk") { S.autoJunk = !S.autoJunk; if (S.autoJunk) autoEquip(); }
  else if (d.a === "autoeq") { S.autoEquip = !S.autoEquip; if (S.autoEquip) autoEquip(); }
  else if (d.a === "sellbag") { for (const it of S.bag) sellItem(it); S.bag = []; }
  else if (d.a === "autoparts") S.autoParts = !S.autoParts;
  else if (d.a === "sellparts") { for (const n in S.parts) gain(S.parts[n].val); S.parts = {}; }
  else if (d.a === "autospend") { S.autoSpend = !S.autoSpend; if (S.autoSpend) autoSpend(); }
  else if (d.a === "autosmith") S.autoSmith = !S.autoSmith;
  else if (d.a === "autorecruit") S.autoRecruit = !S.autoRecruit;
  dirty = true; renderPanel();
};
$("spd").onclick = () => { const o = [1, 2, 4, 8, 16]; S.speed = o[(o.indexOf(S.speed) + 1) % o.length] || 1; $("spd").textContent = S.speed + "x"; };
$("spd").textContent = S.speed + "x";

function hud() {
  $("gold").textContent = fmt(S.gold) + "g";
  $("exp").textContent = fmt(S.exp) + " xp";
  const alive = mons.filter(m => !m.dead).length;
  $("foes").textContent = (alive ? alive + " foes" : "cleared") + " · party " + heroes.length;
  const cards = partyEl.children;
  heroes.forEach((h, i) => {
    const c = cards[i]; if (!c) return;
    c.classList.toggle("down", h.down); c.classList.toggle("sel", i === S.sel && heroes.length > 1);
    c.querySelector(".hp i").style.width = Math.max(0, h.hp / h.ST.hp * 100) + "%";
    c.querySelector(".mp i").style.width = Math.max(0, h.mp / h.ST.mp * 100) + "%";
  });
  const now = Date.now(); goldWin = goldWin.filter(x => now - x[0] < 20000); xpWin = xpWin.filter(x => now - x[0] < 20000);
  const gps = goldWin.reduce((a, x) => a + x[1], 0) / 20, xps = xpWin.reduce((a, x) => a + x[1], 0) / 20, sp = Math.max(1, S.speed);
  if (goldWin.length) { S.gpsAvg = S.gpsAvg ? S.gpsAvg * .9 + gps / sp * .1 : gps / sp; S.xpsAvg = S.xpsAvg ? S.xpsAvg * .9 + xps / sp * .1 : xps / sp; }
}

// ================= loop & save =================
function save() { S.t = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
let last = performance.now(), acc = 0, uiT = 0, saveT = 0, panelT = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, .25); last = now;
  acc += dt * S.speed; let n = 0;
  while (acc >= 1 / 30 && n < 480) { update(1 / 30); acc -= 1 / 30; n++; }
  if (n >= 480) acc = 0;
  draw(now);
  uiT -= dt; if (uiT <= 0) { hud(); uiT = .15; if (S.autoSpend) autoSpend(); }
  panelT -= dt; if (panelT <= 0) { panelT = .4; if (dirty) renderPanel(); else refreshPanel(); }
  saveT += dt; if (saveT > 5) { save(); saveT = 0; }
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else { last = performance.now(); acc = 0; } });
addEventListener("pagehide", save);

(function boot() {
  resize(); syncHeroes();
  for (const h of heroes) { h.hp = h.ST.hp; h.mp = h.ST.mp; }
  const away = Math.min((Date.now() - S.t) / 1000, 7200);
  genFloor(); autoEquip(); booted = true;
  if (away > 60 && (S.gpsAvg > 0 || S.xpsAvg > 0)) {
    const g = Math.floor(S.gpsAvg * away * .5), x = Math.floor(S.xpsAvg * away * .5); gain(g); gainXp(x);
    setTimeout(() => say("Welcome back! Your party earned " + fmt(g) + " gold and " + fmt(x) + " xp while away.", "#ffc94a"), 400);
  }
  renderPanel(); requestAnimationFrame(frame);
})();
window.__dbg = {S, get heroes() { return heroes; }, get mons() { return mons; }, get camp() { return camp; }, get smith() { return smith; }, makeItem, pickup, autoEquip, recruit, genCandidate, upgradeItem, rollRarity, floorScale, genFloor};
</script>
